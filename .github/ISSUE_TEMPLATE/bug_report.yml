name: Bug report
description: Something misbehaved — bring the receipts and we can fix it fast.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — one paste does most of the work here. Run

        ```bash
        hermes talk diagnostics --bundle
        ```

        and paste the file it wrote below. The bundle is redacted by
        construction: versions, the NAMES of the variables you have set, device
        and host facts, and every `hermes talk doctor` outcome — no values, no
        logs, no prompts, no transcripts, no audio. Nothing else in this
        template is worth more than that one file.
  - type: textarea
    id: diagnostics_bundle
    attributes:
      label: Diagnostics bundle
      description: Paste the JSON that `hermes talk diagnostics --bundle` wrote (the path is printed). If you cannot run it, say why here instead.
      render: json
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Terminal (hermes talk)
        - /talk inside a session
        - Discord voice channel
        - Dashboard tab
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What you said, what you expected to hear, what you heard
      description: The three-line version is perfect. Include the exact spoken receipt if there was one — the wording is a contract here, and a wrong sentence is a real bug.
      placeholder: |
        Said: "tell the audit to focus on pricing"
        Expected: "queued for their next step — I'll confirm when it lands"
        Heard: (nothing / error / the wrong claim)
    validations:
      required: true
  - type: textarea
    id: talk_status
    attributes:
      label: talk_status output (optional)
      description: In a session, say "status report" (the `talk_status` tool), or hit `GET /api/plugins/hermes-talk/status` on the dashboard. Identity is reported as section names and sizes only — no content leaves your machine.
      render: json
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Tracebacks, relevant knobs you've set (names only — never paste keys). Logs only if you have read them yourself first.
    validations:
      required: false
