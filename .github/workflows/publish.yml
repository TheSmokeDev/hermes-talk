name: publish

# Publishes to PyPI via trusted publishing (OIDC) — no API token stored
# anywhere. Trigger: push a version tag (git tag v0.8.0 && git push --tags).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify declared modules made it into the wheel
        # setuptools silently drops a py_modules name with no file behind it
        # (see the pyproject.toml comment) — fail the release instead.
        run: |
          python - <<'EOF'
          import glob, sys, tomllib, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          expected = tomllib.load(open("pyproject.toml", "rb"))["tool"]["setuptools"]["py-modules"]
          missing = [m for m in expected if f"{m}.py" not in names]
          if missing:
              sys.exit(f"wheel is missing declared modules: {missing}")
          print(f"all {len(expected)} declared modules present in {wheel}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
