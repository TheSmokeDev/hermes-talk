name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch: GitHub occasionally drops pull_request event delivery
  # for a branch (observed 2026-08-19 — three pushes, a close/reopen, zero runs
  # created). This lets an operator run the suite against any ref by hand.
  workflow_dispatch:

jobs:
  test:
    # No secrets, no network: the suite runs against scripted Realtime
    # transcripts and a stub plugin context, and never opens an audio device.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check .
