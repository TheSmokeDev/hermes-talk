name: hermes-talk
version: 0.22.1
manifest_version: 1
requires_hermes: ">=0.21.7"
kind: standalone
description: "OpenAI Realtime speech-to-speech voice for Hermes: duplex talk with live tool calling."
author: SmokeDev (TheSmokeDev)
license: MIT
provides_tools: []
# The ChatGPT subscription is used only through Hermes-signed requests
# (credentialed_provider_request); Talk never holds the token.
requires_auth:
  - openai-codex
provides_hooks:
  - on_session_end
  - subagent_start
  - subagent_stop
  - post_tool_call
  - pre_approval_request
