[project]
name = "hermes-talk"
version = "0.17.0"
description = "Realtime speech-to-speech voice for Hermes Agent — OpenAI, xAI Grok, or Gemini Live — duplex talk with live tool calling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SmokeDev" }]
dependencies = ["httpx>=0.27", "aiohttp>=3.9"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6", "numpy>=1.26"]
# starlette is a TEST dependency, never a runtime one: the dashboard relay's
# streaming response is a starlette response, and its ASGI behavior differs by
# what the SERVER advertises (uvicorn says spec_version 2.3 for HTTP). Without
# the real class in CI that branch is untestable, which is exactly how the
# relay deadlock shipped. `dashboard/plugin_api.py` still runs against its own
# stub when starlette is absent, so the plugin installs without it.
dev = ["pytest>=8", "ruff==0.16.5", "starlette>=0.40"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Flat module layout: the plugin ships top-level talk_* modules (not a package).
# Hermes loads __init__.py by file path at install time; py_modules here is only
# so `pip install -e .` can resolve the importable modules for local dev and
# tests. The talk_ prefix keeps pip installs collision-free (the lesson from
# hermes-homie-memory's generic provider.py/config.py module names).
#
# Shipped modules only. setuptools silently DROPS a name with no file behind
# it, so a roadmap entry here (talk_actuators, talk_flush) would
# read as shipped while the wheel quietly omitted it — add each one as it lands.
[tool.setuptools]
py-modules = [
  "talk_config",
  "talk_auth",
  "talk_doctor",
  "talk_setup",
  "talk_apiserver",
  "talk_approvals",
  "talk_capabilities",
  "talk_cascade_voice",
  "talk_check",
  "talk_diagnostics",
  "talk_wire",
  "talk_identity",
  "talk_host",
  "talk_tools",
  "talk_runs",
  "talk_steer",
  "talk_lifecycle",
  "talk_operator_auth",
  "talk_pause",
  "talk_progress",
  "talk_realtime",
  "talk_openai_realtime",
  "talk_grok_auth",
  "talk_grok_realtime",
  "talk_gemini_realtime",
  "talk_core_realtime",
  "talk_core_provider",
  "talk_core_session",
  "talk_discord",
  "talk_relay",
  "talk_transcript",
  "talk_audio",
  "talk_cli",
  "talk_providers",
  "talk_vault",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# Two pins, because either one alone still lets a ruff release turn the build
# red. The RULE SET is pinned here so a new default rule cannot arrive
# unannounced; the ruff VERSION is pinned in the dev extra above, because the
# same rule set does not mean the same thing across versions. ruff 0.16 stopped
# reporting BLE001 when the handler logs the exception through a name it
# recognises as a logger — it recognises `logger`, not `_log` — so the three
# handlers in talk_core_provider.py (the only module here that both names its
# logger `logger` and carries BLE001 directives) had their `noqa` retired and
# failed CI on RUF100, while every dev box on 0.15.x still required them. Bump
# both pins together, in their own PR, and expect directives to move. BLE stays
# on because this codebase catches broadly on purpose (a live voice call must
# not die on a stack trace) — each one says why, whether or not the current
# ruff still needs a directive to allow it.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.isort]
known-first-party = [
  "talk_apiserver",
  "talk_approvals",
  "talk_audio",
  "talk_auth",
  "talk_capabilities",
  "talk_cascade_voice",
  "talk_check",
  "talk_cli",
  "talk_config",
  "talk_diagnostics",
  "talk_discord",
  "talk_doctor",
  "talk_gemini_realtime",
  "talk_grok_auth",
  "talk_grok_realtime",
  "talk_host",
  "talk_identity",
  "talk_lifecycle",
  "talk_operator_auth",
  "talk_openai_realtime",
  "talk_core_realtime",
  "talk_core_provider",
  "talk_pause",
  "talk_progress",
  "talk_providers",
  "talk_realtime",
  "talk_relay",
  "talk_runs",
  "talk_setup",
  "talk_steer",
  "talk_tools",
  "talk_transcript",
  "talk_wire",
]
