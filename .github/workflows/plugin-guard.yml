name: plugin-guard

on:
  push:
    branches: [main]
  pull_request:
  # Same escape hatch as ci.yml: lets an operator re-run the gate against any
  # ref by hand when event delivery drops.
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. The job checks out this tree and reads scanner
# files from a PUBLIC upstream repository through `gh api`; a token scoped to
# contents:read on this repository can still read public repositories, and
# the authenticated call is only there for the rate limit. Nothing is written
# back to GitHub. Without this block the token inherits the repository
# default, which can be read/write.
permissions:
  contents: read

jobs:
  scan:
    # The upstream plugin scanner (hermes_cli/plugins_install_scan.py in
    # NousResearch/hermes-agent, shipped in Hermes v0.20.4) gates
    # `hermes plugins install`: one critical finding blocks the install and
    # --force does not override it. This job runs that exact scanner over
    # this repository and fails unless the verdict is clean — zero critical
    # AND zero high findings.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Resolve the upstream scanner commit
        id: scanner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(gh api repos/NousResearch/hermes-agent/commits/main --jq .sha)"
          echo "pinning plugin_guard to NousResearch/hermes-agent@${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Download the pinned scanner outside the checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scanner_home="${RUNNER_TEMP}/plugin-guard"
          mkdir -p "${scanner_home}/tools" "${scanner_home}/hermes_cli"
          # Fetch through the authenticated GitHub API, not the raw CDN
          # (raw.githubusercontent.com 429s persistently under load). Even the
          # API can bounce at a sliding rate window, so retry patiently —
          # the scanner stays pinned to the SHA resolved above.
          fetch() {
            local path="$1" out="$2" attempt
            for attempt in 1 2 3 4 5 6; do
              if gh api "repos/NousResearch/hermes-agent/contents/${path}?ref=${{ steps.scanner.outputs.sha }}" \
                  -H "Accept: application/vnd.github.raw" > "$out"; then
                return 0
              fi
              echo "scanner fetch attempt ${attempt} failed; backing off"
              sleep 25
            done
            return 1
          }
          fetch hermes_cli/plugins_install_scan.py "${scanner_home}/hermes_cli/plugins_install_scan.py"
          fetch hermes_cli/plugins_install_scan_context.py "${scanner_home}/hermes_cli/plugins_install_scan_context.py"
          fetch tools/skills_guard.py "${scanner_home}/tools/skills_guard.py"
          fetch tools/skills_guard_credentials.py "${scanner_home}/tools/skills_guard_credentials.py"
          fetch tools/threat_patterns.py "${scanner_home}/tools/threat_patterns.py"
          touch "${scanner_home}/tools/__init__.py" "${scanner_home}/hermes_cli/__init__.py"

      - name: Scan this repository
        run: python .github/plugin_guard_check.py "${RUNNER_TEMP}/plugin-guard" .
